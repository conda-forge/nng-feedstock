schema_version: 1

context:
  name: nng
  version: "2.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/nanomsg/nng/archive/v${{ version }}.tar.gz
  sha256: e2fdcdf126b530e331b4727812b710629cdb5d90d230ce8f080e2eb520299d8d
  patches:
    - if: linux
      then: test.patch

build:
  number: 0

requirements:
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x') }}
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake
    - make
    - ninja
  host:
    - mbedtls >=3.6,<4
  run:
    - if: win
      then: ucrt
    - ${{ pin_compatible('mbedtls', upper_bound='x.x') }}

tests:
  - script:
      - if: linux
        then: test -f $PREFIX/lib/libnng.so
      - if: osx
        then: test -f $PREFIX/lib/libnng.dylib
      - if: unix
        then: nngcat -V
      - if: win
        then: nngcat.exe -V

about:
  summary: nanomsg-next-generation -- light-weight brokerless messaging
  description: |
    nanomsg-next-generation -- light-weight brokerless messaging
  license: MIT
  license_file: LICENSE.txt
  homepage: https://nng.nanomsg.org/
  repository: https://github.com/nanomsg/nng
  documentation: https://nng.nanomsg.org/man/

extra:
  recipe-maintainers:
    - jan-janssen
    - carlodri

schema_version: 1

context:
  name: nng
  version: "2.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/nanomsg/nng/archive/v${{ version }}.tar.gz
  sha256: e2fdcdf126b530e331b4727812b710629cdb5d90d230ce8f080e2eb520299d8d
  patches:
    - if: linux
      then: test.patch

build:
  number: 0

requirements:
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x') }}
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake
    - make
    - ninja
  host:
    - mbedtls >=4.2
  run:
    # ucrt is only packaged for win-64; vc14_runtime covers win-arm64
    - if: win and x86_64
      then: ucrt
    - ${{ pin_compatible('mbedtls', upper_bound='x.x') }}

tests:
  - script:
      - if: linux
        then: test -f $PREFIX/lib/libnng.so
      - if: osx
        then: test -f $PREFIX/lib/libnng.dylib
      - if: unix
        then: nngcat -V
      - if: win
        then: nngcat.exe -V
  # nng_tls_config_alloc() returns NNG_ENOTSUP if nng was built without TLS
  - script:
      - if: win
        then:
          - cl /nologo /I%LIBRARY_INC% test_tls.c /link /LIBPATH:%LIBRARY_LIB% nng.lib
          # nng.dll must use the mbedtls DLLs, not static copies of Mbed TLS
          - dumpbin /dependents %LIBRARY_BIN%\nng.dll | findstr /i mbedtls.dll
          - dumpbin /dependents %LIBRARY_BIN%\nng.dll | findstr /i mbedx509.dll
          - dumpbin /dependents %LIBRARY_BIN%\nng.dll | findstr /i tfpsacrypto.dll
          - test_tls.exe
        else:
          - ${CC} ${CFLAGS} -I${PREFIX}/include test_tls.c -o test_tls ${LDFLAGS} -L${PREFIX}/lib -Wl,-rpath,${PREFIX}/lib -lnng
          - ./test_tls
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
    files:
      recipe:
        - test_tls.c

about:
  summary: nanomsg-next-generation -- light-weight brokerless messaging
  description: |
    nanomsg-next-generation -- light-weight brokerless messaging
  license: MIT
  license_file: LICENSE.txt
  homepage: https://nng.nanomsg.org/
  repository: https://github.com/nanomsg/nng
  documentation: https://nng.nanomsg.org/man/

extra:
  recipe-maintainers:
    - jan-janssen
    - carlodri
